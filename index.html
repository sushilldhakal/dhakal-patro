<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <style>
      html{background:#f8f6f0;color-scheme:light}
      @media (prefers-color-scheme:dark){html{background:#18191a;color-scheme:dark}}
    </style>
    <!-- @ga-snippet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Symbols+2&family=Oxanium:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Symbols+2&family=Oxanium:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      />
    </noscript>
    <link rel="preload" href="/loader.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0e6a6f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#073f43" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vedic Patro — Complete Nepali calendar with Surya Panchanga, BS/AD date converter, festivals, public holidays, and Janma Kundali." />
    <title>Vedic Patro — Nepali Calendar & Panchanga</title>
  </head>
  <body>
    <div id="root">
      <div
        id="app-boot-loader"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f8f6f0;color:#6e7a79;font-family:system-ui,sans-serif"
      >
        <img
          src="/loader.svg"
          width="120"
          height="120"
          alt=""
          fetchpriority="high"
          decoding="async"
          style="border-radius:22%;box-shadow:0 2px 8px rgba(0,0,0,.12)"
        />
        <span style="font-size:14px">लोड हुँदैछ…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
