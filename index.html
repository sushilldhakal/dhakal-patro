<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <style>
      html{background:#f8f6f2;color-scheme:light}
    </style>
    <!-- @ga-snippet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&family=Noto+Sans+Symbols+2&family=Oxanium:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&family=Noto+Sans+Symbols+2&family=Oxanium:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap"
      />
    </noscript>
    <link rel="preload" href="/loader.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#d97706" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b565a" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vedic Patro — Complete Nepali calendar with Surya Panchanga, BS/AD date converter, festivals, public holidays, and Janma Kundali." />
    <title>Vedic Patro — Nepali Calendar & Panchanga</title>
  </head>
  <body>
    <div id="root"></div>
    <template id="boot-loader-tpl">
      <div
        id="app-boot-loader"
        style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f8f6f2;color:#5c4a3a;font-family:system-ui,sans-serif"
      >
        <img
          src="/loader.svg"
          width="120"
          height="120"
          alt=""
          fetchpriority="high"
          decoding="async"
          style="border-radius:22%;box-shadow:0 2px 8px rgba(0,0,0,.12)"
        />
        <span style="font-size:14px">लोड हुँदैछ…</span>
      </div>
    </template>
    <script>
      // Runs before first paint. The server falls back to another route's
      // prerendered HTML for paths without their own file (e.g. /kundali/:id),
      // which used to flash the home page until React took over. When the
      // baked-in route (data-ssr-path, set by scripts/prerender.mjs) doesn't
      // match the URL — or #root is empty, as in dev — show the boot loader
      // instead of the wrong page.
      (function () {
        var root = document.getElementById("root");
        var tpl = document.getElementById("boot-loader-tpl");
        if (!root || !tpl) return;
        var ssrPath = root.getAttribute("data-ssr-path");
        var norm = function (p) {
          return p.replace(/\/+$/, "") || "/";
        };
        if (!ssrPath || norm(ssrPath) !== norm(location.pathname)) {
          root.innerHTML = tpl.innerHTML;
        }
      })();
    </script>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
