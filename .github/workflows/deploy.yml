name: Deploy (retired)

# RETIRED — this repository is the old standalone website. Production now deploys from
# https://github.com/sushilldhakal/patro (branch main), which serves the whole site.
#
# This workflow used to SSH into the production server on every push to main and publish
# this repo's build over the live site. It is now manual-only and does nothing, so pushes
# here can never touch production. (Archiving the repo and deleting its SERVER_IP /
# SERVER_USER / SSH_KEY secrets in Settings is the belt-and-braces step.)
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dhakal-patro is retired. Production deploys from sushilldhakal/patro (main)."
